# nginx.conf — suspicious_ui container
#
# Serves the React SPA and proxies /api/* to Django.
# Mount at: /etc/nginx/conf.d/default.conf
#
# Two responsibilities:
#   1. Serve the built React app (index.html + hashed assets)
#   2. Return index.html for any unknown path so React Router works
#
# /api/* is NOT proxied here — Traefik handles routing to Django directly.
# This config assumes Traefik is in front and this container only serves
# the SPA. If you need direct access (dev/testing), uncomment the proxy block.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (belt-and-suspenders — Traefik also sets these) ──
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "DENY"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Hashed static assets — aggressive caching ────────────────────────
    # Vite outputs files like index-De61QhV2.js — the hash changes on every
    # build, so permanent caching is safe.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── index.html — no cache (React Router entry point) ─────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── SPA catch-all — return index.html for all unknown paths ──────────
    # This is what makes React Router work: /submissions, /dashboard, etc.
    # all return index.html and the browser-side router takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health check endpoint ─────────────────────────────────────────────
    # Used by Docker healthcheck and load balancer probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
}