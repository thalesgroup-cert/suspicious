# nginx.conf — suspicious_ui container
#
# Serves the React SPA and proxies /api/* to Django.
# Mount at: /etc/nginx/conf.d/default.conf
#
# Two responsibilities:
#   1. Serve the built React app (index.html + hashed assets)
#   2. Return index.html for any unknown path so React Router works
#
# In a Traefik-fronted deployment /api/* is normally routed to Django
# directly by Traefik, bypassing this container entirely. But the frontend
# always calls the same-origin relative path VITE_API_BASE=/api (see
# suspicious-ui/.env) - it never talks to the backend's own host:port
# directly. So any deployment WITHOUT Traefik in front (e.g. the plain-HTTP
# dev stack in CLAUDE.md's "Full E2E Dev Deployment", localhost:9021 with no
# reverse proxy) needs this container to proxy /api/* itself, or every API
# call 404s/405s against nginx's own SPA catch-all instead of reaching
# Django - which silently breaks login (POST /api/auth/login/ hits the
# static-file location block and gets a plain 405, no JSON, no cookie).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (belt-and-suspenders — Traefik also sets these) ──
    add_header X-Content-Type-Options    "nosniff"                   always;
    add_header X-Frame-Options           "DENY"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Hashed static assets — aggressive caching ────────────────────────
    # Vite outputs files like index-De61QhV2.js — the hash changes on every
    # build, so permanent caching is safe.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── API proxy (dev/no-Traefik stacks only, see header comment) ───────
    location /api/ {
        proxy_pass http://suspicious:9020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA catch-all — return index.html for all unknown paths ──────────
    # This is what makes React Router work: /submissions, /dashboard, etc.
    # all return index.html and the browser-side router takes over.
    #
    # The entry document must never be cached: it references hashed asset
    # names that change every build. A cached index.html (browser OR an
    # intermediary proxy) keeps pointing at old chunks, so rebuilds appear
    # to have no effect. Headers are repeated here because nginx drops all
    # inherited add_header directives once a location declares its own.
    location / {
        add_header X-Content-Type-Options "nosniff"                          always;
        add_header X-Frame-Options        "DENY"                             always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
        add_header Cache-Control          "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # ── Health check endpoint ─────────────────────────────────────────────
    # Used by Docker healthcheck and load balancer probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;
}