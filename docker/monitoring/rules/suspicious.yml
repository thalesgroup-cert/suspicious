groups:
  - name: suspicious.rules
    rules:

      # ---------------------------------------------------------------------------
      # Submission queue depth
      # Fires when pending + retry items exceed 50 for 10 minutes — signals a
      # stalled Celery worker or a spike in submission volume.
      # ---------------------------------------------------------------------------
      - alert: SubmissionQueueDepthHigh
        expr: |
          (
            suspicious_submission_queue_depth{status="pending"}
            + suspicious_submission_queue_depth{status="retry"}
          ) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Submission queue depth high ({{ $value }} items)"
          description: >
            The combined pending + retry submission queue depth has been above 50
            for 10 minutes. Check the suspicious_celery container logs.

      # ---------------------------------------------------------------------------
      # Cortex error rate
      # Fires when more than 5% of Cortex sync calls fail over a 5-minute window.
      # ---------------------------------------------------------------------------
      - alert: CortexErrorRateHigh
        expr: |
          rate(suspicious_cortex_errors_total[5m])
          /
          rate(suspicious_cortex_calls_total[5m])
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cortex error rate > 5% ({{ $value | humanizePercentage }})"
          description: >
            More than 5% of Cortex analyzer sync calls are failing.
            Check Cortex health and the circuit breaker state.

      # ---------------------------------------------------------------------------
      # Django 5xx rate
      # Fires when more than 1% of all HTTP responses are server errors.
      # ---------------------------------------------------------------------------
      - alert: Django5xxRateHigh
        expr: |
          rate(django_http_responses_total_by_status_urlconf_method_view{status=~"5.."}[5m])
          /
          rate(django_http_responses_total_by_status_urlconf_method_view[5m])
          > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Django 5xx rate > 1% ({{ $value | humanizePercentage }})"
          description: >
            More than 1% of HTTP responses are 5xx errors.
            Check gunicorn logs and Django error handlers.

      # ---------------------------------------------------------------------------
      # Email feeder staleness
      # Fires when the email feeder has not completed a successful poll in 30 min.
      # ---------------------------------------------------------------------------
      - alert: EmailFeederStale
        expr: |
          (time() - suspicious_email_feeder_last_poll_timestamp_seconds) > 1800
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Email feeder has not polled in {{ $value | humanizeDuration }}"
          description: >
            The last successful MinIO email poll was more than 30 minutes ago.
            Check the fetch_emails Celery task and MinIO connectivity.
