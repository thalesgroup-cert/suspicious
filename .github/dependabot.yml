version: 2
updates:
  - package-ecosystem: pip
    directory: /Suspicious
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /email-feeder
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /Analyzers/AIMailAnalyzer
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /suspicious-ui
    schedule:
      interval: weekly
    groups:
      # react and react-dom must move in lockstep — a lone react bump fails
      # the build with "Incompatible React versions" (see PR #311).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: docker
    directory: /Suspicious
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /suspicious-ui
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /email-feeder
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /Analyzers/AIMailAnalyzer
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
