version: 2
updates:
  - package-ecosystem: pip
    directory: /Suspicious
    schedule:
      interval: weekly
    groups:
      # opentelemetry-* packages pin each other's exact versions (sdk 1.N <->
      # instrumentation 0.(N+21)b0); a lone bump fails dependency resolution.
      opentelemetry:
        patterns:
          - "opentelemetry-*"
  - package-ecosystem: pip
    directory: /email-feeder
    schedule:
      interval: weekly
    groups:
      # opentelemetry-* packages pin each other's exact versions (sdk 1.N <->
      # instrumentation 0.(N+21)b0); a lone bump fails dependency resolution.
      opentelemetry:
        patterns:
          - "opentelemetry-*"
  - package-ecosystem: pip
    directory: /Analyzers/AIMailAnalyzer
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /suspicious-ui
    schedule:
      interval: weekly
    groups:
      # react and react-dom must move in lockstep — a lone react bump fails
      # the build with "Incompatible React versions" (see PR #311).
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # playwright (the CLI that installs browsers) and @playwright/test must
      # share one version: bumping only @playwright/test leaves two playwright
      # versions installed and `playwright install` fetches the wrong browser.
      playwright:
        patterns:
          - "playwright"
          - "@playwright/test"
    ignore:
      # vitest 5 is a migration, not a bump: with 5.0.3 one test file fails
      # ("vitest/browser can only be imported inside Browser Mode") and the
      # typecheck breaks on toHaveTextContent(RegExp). Remove when migrated.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /Suspicious
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /suspicious-ui
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /email-feeder
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /Analyzers/AIMailAnalyzer
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
