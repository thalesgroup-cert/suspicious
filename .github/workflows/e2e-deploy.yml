# Full-deploy smoke gate: boot the real stack (Cortex stubbed), drive one
# email through feeder -> S3 -> backend -> case -> ledger -> finalise ->
# preview, assert every hop. Django unit suites run in their own workflow.
name: e2e-deploy
on:
  pull_request:
  push:
    branches: [main, feature/frontweb]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Bootstrap + smoke
        run: ./scripts/ci/bootstrap.sh
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-stack-log
          path: ci-stack.log
