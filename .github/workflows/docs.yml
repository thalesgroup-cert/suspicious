name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "Suspicious/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "Suspicious/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./Suspicious
          load: true
          tags: suspicious:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate OpenAPI schema
        run: |
          mkdir -p docs/reference
          chmod 777 docs/reference
          docker run --rm \
            -v "${{ github.workspace }}/Suspicious/Suspicious":/app/Suspicious \
            -v "${{ github.workspace }}/Suspicious/settings.ci.json":/app/settings.json:ro \
            -v "${{ github.workspace }}/docs":/docs \
            -e SUSPICIOUS_CONFIG_PATH=/app/settings.json -w /app/Suspicious \
            suspicious:ci \
            python manage.py spectacular \
              --settings=suspicious.settings \
              --skip-checks \
              --file /docs/reference/openapi.yaml
          test -s docs/reference/openapi.yaml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs toolchain
        run: pip install -r docs/requirements.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
