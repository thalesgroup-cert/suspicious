name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 21 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # See ci.yml's `changes` job for the rationale — duplicated here rather than
  # shared via a reusable workflow since it's ~15 lines and each workflow
  # file's job graph differs enough that the indirection isn't worth it.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      feeder: ${{ steps.filter.outputs.feeder }}
      analyzers: ${{ steps.filter.outputs.analyzers }}
      ui: ${{ steps.filter.outputs.ui }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'Suspicious/**'
            feeder:
              - 'email-feeder/**'
            analyzers:
              - 'Analyzers/**'
            ui:
              - 'suspicious-ui/**'
            ci:
              - '.github/workflows/**'

  trivy-fs:
    needs: changes
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.feeder == 'true' ||
       needs.changes.outputs.analyzers == 'true' ||
       needs.changes.outputs.ui == 'true' ||
       needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan
        # v0.28.0 and v0.30.0 both pin a now-nonexistent aquasecurity/setup-trivy
        # tag (v0.2.1, v0.2.2) and fail before ever scanning; v0.36.0 pins that
        # nested action by commit SHA (equivalent to the real tag v0.2.6), so
        # it isn't exposed to the same float-tag drift.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # gitleaks: disabled — gitleaks-action v3 requires a paid license for org
  # repos (no GITLEAKS_LICENSE secret configured) and fails every run with
  # "missing gitleaks license" before scanning anything. Re-enable by
  # restoring this job once a license secret is added, or swap to a
  # license-free scanner/gitleaks-action version.
  # gitleaks:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 0
  #     - uses: gitleaks/gitleaks-action@v3
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Same `matrix` context constraint as ci.yml's docker-build split applies
  # here — a job-level `if` can't see `matrix.path`, so this can't stay one
  # matrix job either.
  pip-audit-suspicious:
    needs: changes
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.ci == 'true' ||
       needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit Suspicious
        # Gating: a known-vulnerable dependency fails the build. If an advisory
        # has no fix yet, triage it and add `--ignore-vuln <GHSA/CVE-id>` here
        # rather than re-muting the whole audit.
        #
        # GHSA-f4j7-r4q5-qw2c (chromadb pre-auth RCE via trust_remote_code on
        # the collections API) has no fix released yet. We only use chromadb
        # as an HttpClient (common.clients.get_chroma_client —
        # get_collection/get/delete), never the vulnerable server code path
        # or trust_remote_code.
        run: |
          pip-audit -r Suspicious/requirements.txt --strict \
            --ignore-vuln GHSA-f4j7-r4q5-qw2c

  pip-audit-email-feeder:
    needs: changes
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.ci == 'true' ||
       needs.changes.outputs.feeder == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit email-feeder
        run: pip-audit -r email-feeder/requirements.txt --strict

  pip-audit-analyzers:
    needs: changes
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.ci == 'true' ||
       needs.changes.outputs.analyzers == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit Analyzers/AIMailAnalyzer
        run: pip-audit -r Analyzers/AIMailAnalyzer/requirements.txt --strict

  npm-audit:
    needs: changes
    if: >
      always() &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.ui == 'true' ||
       needs.changes.outputs.ci == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suspicious-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: suspicious-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
