name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detects which areas changed so unrelated jobs below can skip themselves —
  # a Dependabot bump to one ecosystem (e.g. a single npm package) doesn't
  # need the Python test suite, migration check, or every docker-build entry
  # to run. Skipped jobs report as "skipped", which satisfies required status
  # checks the same as "success". workflow_dispatch has no base to diff
  # against, so every gated job below also has an explicit `|| workflow_dispatch`
  # fallback to run in full on manual trigger.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      feeder: ${{ steps.filter.outputs.feeder }}
      analyzers: ${{ steps.filter.outputs.analyzers }}
      ui: ${{ steps.filter.outputs.ui }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Suspicious/**'
            feeder:
              - 'email-feeder/**'
            analyzers:
              - 'Analyzers/**'
            ui:
              - 'suspicious-ui/**'
            ci:
              - '.github/workflows/**'

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # wagoid/commitlint-github-action's commitDepth doesn't reliably mean
      # "the tip commit" in a pull_request context — observed linting the
      # *oldest* new commit on a multi-commit PR instead (see PR #14). Check
      # out the PR's real head commit explicitly and run commitlint directly
      # over HEAD~1..HEAD so there's no ambiguity about which commit or which
      # ref (merge-preview vs. head) is being examined.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - run: |
          npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint --from HEAD~1 --to HEAD --config .github/commitlint.config.js

  backend-lint:
    needs: changes
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.feeder == 'true' ||
      needs.changes.outputs.analyzers == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.13
      - name: ruff check
        run: ruff check Suspicious/ email-feeder/ Analyzers/

  migration-check:
    needs: changes
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./Suspicious
          load: true
          tags: suspicious:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: makemigrations --check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Suspicious/settings.ci.json":/app/settings.json:ro \
            -e SUSPICIOUS_CONFIG_PATH=/app/settings.json -w /app/Suspicious \
            suspicious:ci \
            python manage.py makemigrations --check --dry-run --settings=suspicious.settings

  backend-test:
    needs: changes
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./Suspicious
          load: true
          tags: suspicious:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Full discovery (no app labels): suspicious.test_settings provides the
      # eager-Celery config the connectors suite needs and the stub URLConf;
      # real-settings boot is still exercised by the migration-check job.
      - name: Django test suite
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Suspicious/Suspicious":/app/Suspicious \
            -v "${{ github.workspace }}/Suspicious/settings.ci.json":/app/settings.json:ro \
            -e SUSPICIOUS_CONFIG_PATH=/app/settings.json -w /app/Suspicious \
            suspicious:ci \
            python manage.py test --settings=suspicious.test_settings -v2

  feeder-test:
    needs: changes
    if: >
      needs.changes.outputs.feeder == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install feeder deps
        working-directory: email-feeder
        run: pip install -r requirements-dev.txt
      - name: pytest
        working-directory: email-feeder
        # pytest runs BOTH the unittest.TestCase files and the pytest-style
        # tests; `unittest discover` silently skips the latter.
        run: python -m pytest tests -v

  frontend:
    needs: changes
    if: >
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: suspicious-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: suspicious-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type-check
        run: pnpm exec tsc -b
      - name: Install Chromium for vitest browser mode
        run: pnpm exec playwright install --with-deps chromium
      - name: Unit tests (browser mode)
        run: pnpm exec vitest --run
      - name: Production build
        run: pnpm run build

  # `matrix` isn't a valid context in a job-level `if` (only in
  # strategy/container/services/steps), so unlike the other path-gated jobs
  # this one can't stay a single matrix job — split per image instead.
  docker-build-suspicious:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build suspicious (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./Suspicious
          push: false
          tags: suspicious:ci
          cache-from: type=gha,scope=suspicious
          cache-to: type=gha,mode=max,scope=suspicious

  docker-build-suspicious-ui:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build suspicious-ui (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./suspicious-ui
          push: false
          tags: suspicious-ui:ci
          cache-from: type=gha,scope=suspicious-ui
          cache-to: type=gha,mode=max,scope=suspicious-ui

  docker-build-suspicious-feeder:
    needs: changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.feeder == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build suspicious-feeder (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./email-feeder
          push: false
          tags: suspicious-feeder:ci
          cache-from: type=gha,scope=suspicious-feeder
          cache-to: type=gha,mode=max,scope=suspicious-feeder
