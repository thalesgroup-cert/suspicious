{{- $computed := dict
      "database" (dict
        "engine" "mysql"
        "host" (include "suspicious.mysqlHost" .)
        "port" 3306
        "name" .Values.mysql.auth.database
        "user" .Values.mysql.auth.username
        "password" .Values.mysql.auth.password)
      "cache" (dict "redis" (dict "host" (include "suspicious.cacheHost" .) "port" 6379))
      "celery" (dict "broker" (dict "host" (include "suspicious.brokerHost" .) "port" 6379))
      "storage" (dict "s3" .Values.storage.s3)
      "cortex" .Values.cortex
      "elasticsearch" .Values.elasticsearch
}}
{{- $secretKey := .Values.django.secretKey }}
{{- if not $secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-settings" (include "suspicious.fullname" .)) }}
{{- if $existing }}
{{- $secretKey = index $existing.data "django_secret_key" | b64dec }}
{{- else }}
{{- $secretKey = randAlphaNum 50 }}
{{- end }}
{{- end }}
{{- $computed = merge $computed (dict "app" (dict "secretKey" $secretKey)) }}
{{- $merged := mergeOverwrite (deepCopy (.Values.settings | default dict)) $computed }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suspicious.fullname" . }}-settings
  labels:
    {{- include "suspicious.labels" . | nindent 4 }}
type: Opaque
stringData:
  settings.json: |
    {{ $merged | toJson }}
  django_secret_key: {{ $secretKey | quote }}
