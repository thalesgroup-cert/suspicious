{{- $secretKey := .Values.django.secretKey }}
{{- if not $secretKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-settings" (include "suspicious.fullname" .)) }}
{{- if $existing }}
{{- $secretKey = index $existing.data "django_secret_key" | b64dec }}
{{- else }}
{{- $secretKey = randAlphaNum 50 }}
{{- end }}
{{- end }}

{{/*
$computed only gains keys for sections this chart can actually point
somewhere: app.secret_key is always generated/reused, but database/redis
host keys are only forced when the corresponding bundled subchart
(mysql/broker/cache) is enabled — otherwise a user-supplied
.Values.settings.database (or redis) host for an external service must
survive the merge below untouched.
*/}}
{{- $computed := dict "app" (dict "secret_key" $secretKey) }}

{{- if .Values.mysql.enabled }}
{{- $_ := set $computed "database" (dict
      "engine" "mysql"
      "host" (include "suspicious.mysqlHost" .)
      "port" 3306
      "name" .Values.mysql.auth.database
      "user" .Values.mysql.auth.username
      "password" .Values.mysql.auth.password) }}
{{- end }}

{{- $redis := dict }}
{{- if .Values.cache.enabled }}
{{- $_ := set $redis "cache_host" (include "suspicious.cacheHost" .) }}
{{- end }}
{{- if .Values.broker.enabled }}
{{- $_ := set $redis "broker_host" (include "suspicious.brokerHost" .) }}
{{- end }}
{{- if $redis }}
{{- $_ := set $computed "redis" $redis }}
{{- end }}

{{/*
storage.s3 / integrations.cortex leaves are now the app's real snake_case
paths (finding 1), which means they'd collide with and silently clobber a
matching .Values.settings.storage.s3.* / .Values.settings.integrations.cortex.*
override if forced unconditionally — same class of bug as finding 4's
database/redis case. Only add a leaf when its values.yaml input is actually
set; an unset (empty-string default) leaf is omitted entirely so the merge
below falls through to the user's own settings, or to the app's own
defaults if nobody set anything either way.
*/}}
{{- $s3 := dict }}
{{- if .Values.storage.s3.endpoint }}{{- $_ := set $s3 "endpoint" .Values.storage.s3.endpoint }}{{- end }}
{{- if .Values.storage.s3.region }}{{- $_ := set $s3 "region" .Values.storage.s3.region }}{{- end }}
{{- if .Values.storage.s3.bucket }}{{- $_ := set $s3 "media_bucket" .Values.storage.s3.bucket }}{{- end }}
{{- if .Values.storage.s3.publicEndpoint }}{{- $_ := set $s3 "public_endpoint" .Values.storage.s3.publicEndpoint }}{{- end }}
{{- if .Values.storage.s3.accessKey }}{{- $_ := set $s3 "access_key" .Values.storage.s3.accessKey }}{{- end }}
{{- if .Values.storage.s3.secretKey }}{{- $_ := set $s3 "secret_key" .Values.storage.s3.secretKey }}{{- end }}
{{- if $s3 }}
{{- $_ := set $computed "storage" (dict "s3" $s3) }}
{{- end }}

{{- $cortex := dict }}
{{- if .Values.cortex.baseUrl }}{{- $_ := set $cortex "url" .Values.cortex.baseUrl }}{{- end }}
{{- if .Values.cortex.apiKey }}{{- $_ := set $cortex "api_key" .Values.cortex.apiKey }}{{- end }}
{{- if .Values.cortex.webhookSecret }}{{- $_ := set $cortex "webhook_secret" .Values.cortex.webhookSecret }}{{- end }}

{{/*
chromadb is deployed by this same chart (templates/chromadb/statefulset.yaml)
under a well-known Service name, so its host/port are always computed —
there's no "external chromadb" case to preserve a user override for. cortex
is genuinely external, so it only goes into $computed when the user actually
configured it via values.
*/}}
{{- $integrations := dict "chromadb" (dict
      "host" (printf "%s-chromadb" (include "suspicious.fullname" .))
      "port" (.Values.chromadb.service.port | int)) }}
{{- if $cortex }}
{{- $_ := set $integrations "cortex" $cortex }}
{{- end }}
{{- $_ := set $computed "integrations" $integrations }}

{{- $_ := set $computed "elasticsearch" .Values.elasticsearch }}

{{- $merged := mergeOverwrite (deepCopy (.Values.settings | default dict)) $computed }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "suspicious.fullname" . }}-settings
  labels:
    {{- include "suspicious.labels" . | nindent 4 }}
type: Opaque
stringData:
  settings.json: |
    {{ $merged | toJson }}
  django_secret_key: {{ $secretKey | quote }}
