apiVersion: v1
kind: Pod
metadata:
  name: {{ include "suspicious.fullname" . }}-test-connection
  labels:
    {{- include "suspicious.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - 'curl -sf http://{{ include "suspicious.fullname" . }}:{{ .Values.suspicious.service.port }}/api/health/'
