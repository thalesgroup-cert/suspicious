apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "suspicious.fullname" . }}
  labels:
    {{- include "suspicious.labels" . | nindent 4 }}
    app.kubernetes.io/component: suspicious
spec:
  replicas: {{ .Values.suspicious.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: suspicious
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: suspicious
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: suspicious
          image: "{{ .Values.suspicious.image.repository }}:{{ .Values.suspicious.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.suspicious.image.pullPolicy }}
          command: ["gunicorn", "suspicious.wsgi:application", "--config", "/app/gunicorn.conf.py"]
          ports:
            - containerPort: 9020
          env:
            - name: SUSPICIOUS_CONFIG_PATH
              value: /app/settings.json
          volumeMounts:
            - name: settings
              mountPath: /app/settings.json
              subPath: settings.json
              readOnly: true
            - name: tls-bundle
              mountPath: /etc/private
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health/
              port: 9020
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 9020
            periodSeconds: 60
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 9020
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.suspicious.resources | nindent 12 }}
      volumes:
        - name: settings
          secret:
            secretName: {{ include "suspicious.fullname" . }}-settings
        - name: tls-bundle
          secret:
            secretName: {{ include "suspicious.fullname" . }}-tls-bundle
