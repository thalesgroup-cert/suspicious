apiVersion: v1
kind: Service
metadata:
  name: {{ include "suspicious.fullname" . }}-ui
  labels:
    {{- include "suspicious.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
  ports:
    - port: {{ .Values.suspiciousUi.service.port }}
      targetPort: 80
