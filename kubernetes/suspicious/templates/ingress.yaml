{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "suspicious.fullname" . }}
  labels:
    {{- include "suspicious.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.secretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range list "/api/docs" "/api/schema" "/docs" "/schema" "/admin" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "suspicious.fullname" $ }}
                port:
                  number: {{ $.Values.suspicious.service.port }}
          {{- end }}
          {{- range list "/api" "/static" "/media" "/oidc" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "suspicious.fullname" $ }}
                port:
                  number: {{ $.Values.suspicious.service.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "suspicious.fullname" . }}-ui
                port:
                  number: {{ .Values.suspiciousUi.service.port }}
{{- end }}
