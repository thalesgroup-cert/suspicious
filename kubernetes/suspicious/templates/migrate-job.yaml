apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "suspicious.fullname" . }}-migrate
  labels:
    {{- include "suspicious.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.suspicious.image.repository }}:{{ .Values.suspicious.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.suspicious.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--no-input"]
          env:
            - name: SUSPICIOUS_CONFIG_PATH
              value: /app/settings.json
          volumeMounts:
            - name: settings
              mountPath: /app/settings.json
              subPath: settings.json
              readOnly: true
            - name: tls-bundle
              mountPath: /etc/private
              readOnly: true
      volumes:
        - name: settings
          secret:
            secretName: {{ include "suspicious.fullname" . }}-settings
        - name: tls-bundle
          secret:
            secretName: {{ include "suspicious.fullname" . }}-tls-bundle
