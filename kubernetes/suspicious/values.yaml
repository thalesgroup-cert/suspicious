# Global
imagePullSecrets: []
fullnameOverride: ""

mysql:
  enabled: true
  architecture: standalone   # or "replication" for a read replica
  auth:
    database: suspicious
    username: suspicious
    password: ""             # required — set via -f or --set
    rootPassword: ""         # required — set via -f or --set
  image:
    tag: "8.0.42"

broker:
  enabled: true
  architecture: standalone
  # scoped to this alias only (not the umbrella's true global:) — this
  # subchart's image.repository below is valkey/valkey, not bitnami/redis,
  # which trips the chart's built-in image-provenance check. mysql doesn't
  # need this: it only overrides .tag, still within the recognized repo.
  global:
    security:
      allowInsecureImages: true
  image:
    repository: valkey/valkey
    tag: "9-alpine"
  auth:
    enabled: true
    password: ""

cache:
  enabled: true
  architecture: standalone
  # see broker's comment above — same reason, scoped to this alias only.
  global:
    security:
      allowInsecureImages: true
  image:
    repository: valkey/valkey
    tag: "9-alpine"
  auth:
    enabled: true
    password: ""

tlsBundle:
  certfile: ""
  keyfile: ""
  rootcafile: ""
