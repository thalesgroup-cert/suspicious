suite: secret-settings
templates:
  - secret-settings.yaml
tests:
  - it: renders valid JSON with computed DB host and cortex URL, using the app's real dotted key names
    set:
      mysql.auth.database: suspicious
      mysql.auth.username: suspicious
      mysql.auth.password: "dbpass"
      cortex.baseUrl: "https://cortex.internal"
      cortex.apiKey: "abc123"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-suspicious-settings
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"host":\s*"RELEASE-NAME-mysql"'
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"integrations":\{"chromadb":\{.*?\},"cortex":\{.*?"url":\s*"https://cortex\.internal".*?\}\}'
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"api_key":\s*"abc123"'
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"secret_key":\s*"[^"]+"'
      - notMatchRegex:
          path: stringData["settings.json"]
          pattern: '"secretKey"'
      - notMatchRegex:
          path: stringData["settings.json"]
          pattern: '"integrations":.*"baseUrl"'
  - it: computes redis.cache_host and redis.broker_host (no separate port key — app hardcodes 6379)
    asserts:
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"redis":\{"broker_host":\s*"RELEASE-NAME-broker-master","cache_host":\s*"RELEASE-NAME-cache-master"\}'
  - it: computes storage.s3 with the app's snake_case key names
    set:
      storage.s3.accessKey: "minio"
      storage.s3.secretKey: "miniosecret"
      storage.s3.bucket: "suspicious-media"
    asserts:
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"access_key":\s*"minio"'
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"secret_key":\s*"miniosecret"'
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"media_bucket":\s*"suspicious-media"'
  - it: wires the same-chart chromadb Service into integrations.chromadb
    asserts:
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"chromadb":\{"host":\s*"RELEASE-NAME-suspicious-chromadb","port":\s*8000\}'
  - it: user-supplied settings values win on non-computed keys
    set:
      settings.branding.productName: "Custom Name"
    asserts:
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"productName":\s*"Custom Name"'
  - it: does not force database.host when mysql is disabled, letting a user-supplied external DB host survive
    set:
      mysql.enabled: false
      settings.database.host: "external-db.example.com"
      settings.database.name: "suspicious"
      settings.database.user: "suspicious"
      settings.database.password: "extpass"
    asserts:
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"host":\s*"external-db\.example\.com"'
      - notMatchRegex:
          path: stringData["settings.json"]
          pattern: 'RELEASE-NAME-mysql'
  - it: does not force redis.cache_host/broker_host when cache/broker are disabled, letting user-supplied external hosts survive
    set:
      cache.enabled: false
      broker.enabled: false
      settings.redis.cache_host: "external-cache.example.com"
      settings.redis.broker_host: "external-broker.example.com"
    asserts:
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"cache_host":\s*"external-cache\.example\.com"'
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"broker_host":\s*"external-broker\.example\.com"'
  - it: does not force integrations.cortex.url/storage.s3.access_key when the matching values.yaml input is unset, letting user-supplied settings overrides survive
    set:
      settings.integrations.cortex.url: "https://user-cortex"
      settings.storage.s3.access_key: "useraccess"
    asserts:
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"url":\s*"https://user-cortex"'
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"access_key":\s*"useraccess"'
