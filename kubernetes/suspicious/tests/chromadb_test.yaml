suite: chromadb statefulset+service
templates:
  - chromadb/statefulset.yaml
  - chromadb/service.yaml
tests:
  - it: requests a 10Gi PVC by default
    template: chromadb/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
  - it: readiness probe hits the v2 heartbeat endpoint
    template: chromadb/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/v2/heartbeat
  - it: mounts persistent data at /chroma/chroma (the image's default persist_directory)
    template: chromadb/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /chroma/chroma
  - it: sets imagePullSecrets when configured
    template: chromadb/statefulset.yaml
    set:
      imagePullSecrets:
        - name: my-registry-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: my-registry-secret
  - it: service targets port 8000
    template: chromadb/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8000
