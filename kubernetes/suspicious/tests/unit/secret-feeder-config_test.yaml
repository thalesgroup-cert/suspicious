suite: secret-feeder-config
templates:
  - secret-feeder-config.yaml
tests:
  - it: renders feederConfig values as JSON
    set:
      feederConfig.imap.host: "imap.example.com"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-suspicious-feeder-config
      - matchRegex:
          path: stringData["config.json"]
          pattern: '"host":\s*"imap\.example\.com"'
