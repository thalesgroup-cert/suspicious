suite: secret-tls-bundle
templates:
  - secret-tls-bundle.yaml
tests:
  - it: renders the three PEM keys
    set:
      tlsBundle.certfile: "CERT"
      tlsBundle.keyfile: "KEY"
      tlsBundle.rootcafile: "ROOTCA"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-suspicious-tls-bundle
      - equal:
          path: stringData["certfile.pem"]
          value: "CERT"
      - equal:
          path: stringData["keyfile.pem"]
          value: "KEY"
      - equal:
          path: stringData["rootcafile.pem"]
          value: "ROOTCA"
