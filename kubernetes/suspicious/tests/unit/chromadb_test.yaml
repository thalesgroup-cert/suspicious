suite: chromadb statefulset+service
templates:
  - chromadb/statefulset.yaml
  - chromadb/service.yaml
tests:
  - it: requests a 10Gi PVC by default
    template: chromadb/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 10Gi
  - it: readiness probe hits the heartbeat endpoint
    template: chromadb/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/v1/heartbeat
  - it: service targets port 8000
    template: chromadb/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8000
