suite: secret-settings
templates:
  - secret-settings.yaml
tests:
  - it: renders valid JSON with computed DB host and cortex base URL
    set:
      mysql.auth.database: suspicious
      mysql.auth.username: suspicious
      mysql.auth.password: "dbpass"
      cortex.baseUrl: "https://cortex.internal"
      cortex.apiKey: "abc123"
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-suspicious-settings
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"host":\s*"RELEASE-NAME-mysql"'
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"baseUrl":\s*"https://cortex\.internal"'
  - it: user-supplied settings values win on non-computed keys
    set:
      settings.branding.productName: "Custom Name"
    asserts:
      - matchRegex:
          path: stringData["settings.json"]
          pattern: '"productName":\s*"Custom Name"'
