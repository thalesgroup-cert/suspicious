# compose_databases.yaml
#
# Base service definitions for data stores.
# Extended (not run directly) by docker-compose.yml.
#
# Volumes are declared in docker-compose.yml to avoid the "volume declared
# in multiple files" warning that Compose emits when volumes appear in both
# a base file and the override.

services:

  db_suspicious:
    init: true
    expose:
      - "3306"
    restart: always
    command: "\
      --default-authentication-plugin=mysql_native_password \
      --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-2048M} \
      --innodb-change-buffering=${INNODB_CHANGE_BUFFERING:-none} \
      --innodb-io-capacity=${INNODB_IO_CAPACITY:-1000} \
      --innodb-io-capacity-max=${INNODB_IO_CAPACITY_MAX:-2000} \
      --innodb-log-file-size=${INNODB_LOG_FILE_SIZE:-600M} \
      --innodb-read-io-threads=${INNODB_READ_IO_THREADS:-16} \
      --innodb-stats-persistent=${INNODB_STATS_PERSISTENT:-ON} \
      --innodb-write-io-threads=${INNODB_WRITE_IO_THREADS:-4}"
    volumes:
      - "db_suspicious_data:/var/lib/mysql:Z"
    cap_add:
      - SYS_NICE
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - suspicious_network

  elasticsearch:
    init: true
    expose:
      - "9200"
    restart: unless-stopped
    volumes:
      - "elasticsearch_data:/usr/share/elasticsearch/data:Z"
      - "elasticsearch_logs:/usr/share/elasticsearch/logs:Z"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    environment:
      http_proxy:               "${HTTP_PROXY:-}"
      https_proxy:              "${HTTPS_PROXY:-}"
      no_proxy:                 "localhost"
      discovery.type:           "single-node"
      xpack.security.enabled:   "false"
      http.host:                "0.0.0.0"
      cluster.name:             "suspicious"
      script.allowed_types:     "inline,stored"
      bootstrap.memory_lock:    "true"
      ES_JAVA_OPTS:             "${ES_JAVA_OPTS:--Xms3g -Xmx3g}"
    security_opt:
      - no-new-privileges:true
    networks:
      - suspicious_network

  rustfs:
    restart: always
    expose:
      - "9000"
    ports:
      - "127.0.0.1:${MINIO_PORT:-35000}:9001"
    environment:
      RUSTFS_ACCESS_KEY:    ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY:    ${MINIO_ROOT_PASSWORD}
      RUSTFS_VOLUMES:       /data
      RUSTFS_ADDRESS:       0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    volumes:
      - "rustfs_data:/data:Z"
    security_opt:
      - no-new-privileges:true
    networks:
      - suspicious_network

  chromadb:
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - "chromadb_data:/data:Z"
    security_opt:
      - no-new-privileges:true
    networks:
      - suspicious_network

  redis_broker:
    init: true
    restart: always
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - suspicious_network

  redis_cache:
    init: true
    restart: always
    expose:
      - "6379"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6379 ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - suspicious_network

# Volume stubs — the named volumes are declared in docker-compose.yml.
# These stubs satisfy Compose's requirement that volumes referenced by
# a service must be declared somewhere in the same file or be external.
volumes:
  db_suspicious_data:
    driver: local
  elasticsearch_data:
  elasticsearch_logs:
  rustfs_data:
  chromadb_data:

networks:
  suspicious_network:
    external: true
    name: ${NETWORK_NAME}