services:
  db_suspicious:
    init: true
    expose:
      - "3306"
    restart: always
    command: "\
      --default-authentication-plugin=mysql_native_password \
      --innodb-buffer-pool-size=${INNODB_BUFFER_POOL_SIZE:-2048M} \
      --innodb-change-buffering=${INNODB_CHANGE_BUFFERING:-none} \
      --innodb-io-capacity=${INNODB_IO_CAPACITY:-1000} \
      --innodb-io-capacity-max=${INNODB_IO_CAPACITY_MAX:-2000} \
      --innodb-log-file-size=${INNODB_LOG_FILE_SIZE:-600M} \
      --innodb-read-io-threads=${INNODB_READ_IO_THREADS:-16} \
      --innodb-stats-persistent=${INNODB_STATS_PERSISTENT:-ON} \
      --innodb-write-io-threads=${INNODB_WRITE_IO_THREADS:-4}"
    volumes:
      - "db_suspicious_data:/var/lib/mysql:Z"
    cap_add:
      - SYS_NICE
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - suspicious_network

  elasticsearch:
    init: true
    expose:
      - "9200"
    restart: unless-stopped
    volumes:
      - "elasticsearch_data:/usr/share/elasticsearch/data:Z"
      - "elasticsearch_logs:/usr/share/elasticsearch/logs:Z"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      http_proxy: "${HTTP_PROXY}"
      https_proxy: "${HTTPS_PROXY}"
      no_proxy: "localhost"
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      http.host: "0.0.0.0"
      cluster.name: "suspicious"
      script.allowed_types: "inline,stored"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms5g -Xmx5g"
    networks:
      - suspicious_network

  minio:
    restart: always
    expose:
      - "9000"
    ports:
      - "127.0.0.1:${MINIO_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - "minio_data:/data:Z"
    networks:
      - suspicious_network

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - "chromadb_data:/data:Z"
    networks:
      - suspicious_network

volumes:
  db_suspicious_data:
    driver: local
  elasticsearch_data:
    driver: local
  elasticsearch_logs:
    driver: local
  minio_data:
    driver: local
  chromadb_data:
    driver: local

networks:
  suspicious_network:
    external: true
    name: ${NETWORK_NAME}
