# compose_reverse_proxy.yaml

services:
  traefik:
    init: true
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN_CORP: ${DOMAIN_CORP}
      NO_PROXY: ${NO_PROXY}
      no_proxy: ${NO_PROXY}
    networks:
      - suspicious_network
      - reverse_network
      - docker_traefik
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Traefik static config
      - "${TRAEFIK_PATH}/traefik.yaml:/etc/traefik/traefik.yaml:ro"
      # Dynamic config (security headers middleware, TLS options, etc.)
      - "${TRAEFIK_PATH}/dynamic:/dynamic:ro"
      # TLS certificates
      - "${CA_PATH}:/etc/private:ro"
      # Access and error logs
      - "${TRAEFIK_PATH}/logs:/var/log/traefik"
      # No Docker socket here: the Docker provider reads container labels through
      # docker_proxy_traefik, which allows only listing containers and events.
    # Traefik dashboard — accessible only from localhost in production.
    # Remove the port mapping entirely if you use the file provider dashboard.
    # ports:
    #   - "127.0.0.1:8080:8080"

  # The only service that mounts the Docker socket for Traefik. GET only (POST=0),
  # containers and events only, no TLS and no authentication: reachable solely from
  # the internal docker_traefik network that Traefik shares with it.
  docker_proxy_traefik:
    init: true
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_traefik

networks:
  suspicious_network:
    external: true
    name: ${NETWORK_NAME}
  reverse_network:
  docker_traefik:
    internal: true
