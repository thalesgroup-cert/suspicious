name: suspicious

services:
  suspicious:
    extends:
      file: compose_apps.yaml
      service: suspicious
    build:
      context: ${SUSPICIOUS_PATH}/
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
    image: ghcr.io/thalesgroup-cert/suspicious:${SUSPICIOUS_VERSION}
    container_name: suspicious
    depends_on:
      db_suspicious:
        condition: service_healthy
      cortex:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9020/admin/login/| grep -q 200 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 15
      start_period: 60s

  suspicious_ui:
    extends:
      file: compose_apps.yaml
      service: suspicious_ui
    build:
      context: ${SUSPICIOUS_UI_PATH}/
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
    container_name: suspicious_ui
    depends_on:
      - suspicious
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.suspicious-ui.rule=Host(`${DOMAIN_CORP}`)"
      - "traefik.http.routers.suspicious-ui.entrypoints=websecure"
      - "traefik.http.routers.suspicious-ui.tls=true"
      - "traefik.http.services.suspicious-ui.loadbalancer.server.port=80"

  db_suspicious:
    extends:
      file: compose_databases.yaml
      service: db_suspicious
    image: mariadb:${DB_SUSPICIOUS_VERSION}
    container_name: db_suspicious
    healthcheck:
      test: mariadb-admin --user=${MYSQL_USER} --password=${MYSQL_PASSWORD} status
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 30s

  cortex:
    extends:
      file: compose_apps.yaml
      service: cortex
    image: thehiveproject/cortex:${CORTEX_VERSION}
    container_name: cortex
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9001/api/status | grep -q 200 || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s

  elasticsearch:
    extends:
      file: compose_databases.yaml
      service: elasticsearch
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    container_name: elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -k --silent --fail localhost:9200/_cluster/health | grep -Eq '\"status\":\"green\"|\"status\":\"yellow\"' || exit 1"]
      interval: 20s
      timeout: 60s
      retries: 30
      start_period: 60s

  minio:
    extends:
      file: compose_databases.yaml
      service: minio
    image: minio/minio:${MINIO_VERSION}
    command: server /data --console-address ":9001"
    container_name: minio

  chromadb:
    extends:
      file: compose_databases.yaml
      service: chromadb
    image: chromadb/chroma:latest
    container_name: chromadb

  feeder:
    extends:
      file: compose_apps.yaml
      service: feeder
    build:
      context: ${FEEDER_PATH}/
      dockerfile: Dockerfile
      args:
        - NO_PROXY=localhost,minio,chromadb
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
    container_name: email_feeder
    depends_on:
      - suspicious

  traefik:
    init: true
    image: traefik:${TRAEFIK_VERSION}
    container_name: traefik
    extends:
      file: compose_reverse_proxy.yaml
      service: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${NETWORK_NAME}"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"

volumes:
  db_suspicious_data:
    driver: local
  elasticsearch_data:
    driver: local
  elasticsearch_logs:
    driver: local
  minio_data:
    driver: local
  cortex_jobs:
    driver: local
  chromadb_data:
    driver: local

networks:
  suspicious_network:
    external: true
    name: ${NETWORK_NAME}
  reverse_network: