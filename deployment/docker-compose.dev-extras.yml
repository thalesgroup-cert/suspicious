# docker-compose.dev-extras.yml
#
# Opt-in only — NOT auto-loaded by `docker compose` (unlike
# docker-compose.override.yml). Pass it explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev-extras.yml \
#     up -d greenmail openldap
#
# Dev-only mail + directory services, not part of the upstream compose set.
# greenmail is the same disposable SMTP+IMAP server
# email-feeder/docker-compose.e2e.yaml uses for its own e2e test; openldap is
# a throwaway directory seeded from docker/openldap/bootstrap.ldif so
# profiles/profiles_utils/ldap.py has a real server to sync against locally.
# See CLAUDE.md's /deploy-full-e2e section for the full setup, including the
# SMTP-AUTH and openldap-seeding gotchas already worked out there.

name: suspicious

services:

  greenmail:
    image: greenmail/standalone:latest
    container_name: ${SVC_PREFIX:-}greenmail
    restart: unless-stopped
    environment:
      # One mailbox per persona so outbound notifications (acknowledgement,
      # final-result, challenge emails) can be fetched over IMAP for
      # verification, not just the monitored CERT inbox.
      GREENMAIL_OPTS: >
        -Dgreenmail.setup.test.all
        -Dgreenmail.users=${GREENMAIL_IMAP_USER:-suspicious@meridian.example}:${GREENMAIL_IMAP_PASSWORD:-meridian_dev_imap_pw},elena.voss@meridian.example:meridian_dev_imap_pw,adaeze.okafor@meridian.example:meridian_dev_imap_pw,jordan.kim@meridian.example:meridian_dev_imap_pw,camila.reyes@meridian.example:meridian_dev_imap_pw,haruto.sato@meridian.example:meridian_dev_imap_pw,sam.whitfield@meridian.example:meridian_dev_imap_pw
        -Dgreenmail.starttls.enable=false
        -Dgreenmail.hostname=0.0.0.0
    ports:
      - "127.0.0.1:3025:3025"   # SMTP — point Suspicious/settings.json email.smtp and
                                 # email-feeder/config.json mail.* here
      - "127.0.0.1:3143:3143"   # IMAP — email-feeder polls this mailbox
    networks:
      - suspicious_network

  openldap:
    image: osixia/openldap:1.5.0
    container_name: ${SVC_PREFIX:-}openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "Meridian Group"
      LDAP_DOMAIN: "meridian.example"
      LDAP_BASE_DN: "dc=meridian,dc=example"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-meridian_dev_ldap_admin_pw}
      LDAP_TLS: "false"
    # Persona data is NOT loaded via the image's bootstrap-ldif volume: its
    # entrypoint chown/sed/rm's those paths in place during setup, which
    # collides with bind mounts ("Device or resource busy") whether a single
    # file or the whole custom/ directory is mounted there. Loaded instead via
    # `ldapadd` after the container is healthy — see docker/openldap/README.md
    # / deploy notes. LDAP_BASE_DN below still auto-creates the dc=meridian
    # root entry the seed data hangs off of.
    ports:
      - "127.0.0.1:3389:389"
    networks:
      - suspicious_network
