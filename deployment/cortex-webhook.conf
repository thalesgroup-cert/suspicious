# P5 — Cortex job-completion webhook configuration
#
# Merge this block into cortex/application.conf to enable push-based
# case updates. Without it, Suspicious falls back to the 60-second cron poll.
#
# Prerequisites:
#   1. Set integrations.cortex.webhook_secret in Suspicious/settings.json
#      to a strong random value:
#        openssl rand -hex 32
#   2. Paste that same value as the "key" below.
#   3. Replace <YOUR_DOMAIN> with the Suspicious platform hostname.
#
# Endpoint: POST https://<YOUR_DOMAIN>/api/cortex/webhook/
# Auth:     Authorization: Bearer <webhook_secret>
# Body:     {"jobId": "<cortex-job-id>", "status": "Success"}

notification.webhook.endpoints = [
  {
    name = suspicious
    url = "https://<YOUR_DOMAIN>/api/cortex/webhook/"
    version = 0
    wsConfig {}
    auth {
      type = "bearer"
      key = "<webhook_secret>"
    }
  }
]
